cases:
- id: top
  assert: top3([5, 1, 9, 7, 3]) == [9, 7, 5]
  message: top3([5, 1, 9, 7, 3]) gives [9, 7, 5]
- id: short
  assert: top3([2]) == [2]
  message: fewer than three gives what there is
- id: untouched
  assert: '(lambda s: (top3(s), s)[1])([1, 3, 2]) == [1, 3, 2]'
  message: the original list is not changed
