cases:
- id: counts
  assert: '(lambda f: (f(1), f(2), f.calls))(counted(lambda x: x))[2] == 2'
  message: two calls are counted
- id: result
  assert: 'counted(lambda a, b=1: a + b)(2, b=3) == 5'
  message: arguments and results pass straight through
- id: name
  assert: counted(len).__name__ == 'len'
  message: the decorated function keeps its name
