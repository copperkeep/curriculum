# Splits and merges need more than a 1:1 alias. Because skill_state is a recomputable
# cache, applying a transition is a replay of progress_events through this mapping, not a
# destructive migration. Historical events keep their original IDs forever.
#
# Example, for when this first happens:
#   - from: for-loop-range
#     to: [for-loop-iteration, range-generator]
#     kind: split
#     policy: carry-forward-reduced
transitions: []
