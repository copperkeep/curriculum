name: release

# Curriculum releases on a calendar version, independently of the application's semver.
# The manifest's minAppVersion is what keeps the two honest.
on:
  push:
    tags: ["20*"] # 2026.09.1
  workflow_dispatch:
    inputs:
      version:
        description: "Content version, e.g. 2026.09.1"
        required: true

env:
  REGISTRY: ghcr.io
  NAMESPACE: copperkeep

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml

      - id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME}"
          fi
          declared="$(python -c "import yaml;print(yaml.safe_load(open('manifest.yaml'))['contentVersion'])")"
          if [ "$declared" != "$version" ]; then
            echo "::error::manifest.yaml declares $declared but the release is $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Gates
        run: python tools/check.py

      - name: Narration
        # en_US-libritts_r-medium: trained on LibriTTS-R, CC BY 4.0 (credit in
        # dist-audio/CREDITS.txt). Pinned by hash so a re-upload cannot change the voice
        # under the same file names. Remove NARRATION_ONLY to narrate every step.
        env:
          VOICE_URL: https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/libritts_r/medium/en_US-libritts_r-medium
          NARRATION_ONLY: audio/py/printing/
        run: |
          mkdir -p voices dist-audio
          curl -fsSL -o voices/voice.onnx "$VOICE_URL.onnx"
          curl -fsSL -o voices/voice.onnx.json "$VOICE_URL.onnx.json"
          sha256sum -c - <<'SUMS'
          10bb85e071d616fcf4071f369f1799d0491492ab3c5d552ec19fb548fac13195  voices/voice.onnx
          b471dc60d2d8335e819c393d196d6fbf792817f40051257b269878505bc9afb3  voices/voice.onnx.json
          SUMS
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install piper-tts
          python tools/audio.py --voice voices/voice.onnx --speaker 0 --out dist-audio \
            ${NARRATION_ONLY:+--only "$NARRATION_ONLY"}
          cp voices/CREDITS.txt dist-audio/CREDITS.txt

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: content image
        id: content
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.content
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          tags: |
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/content:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/content:latest

      - name: audio image
        id: audio
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.audio
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          tags: |
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/audio:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/audio:latest

      - uses: sigstore/cosign-installer@v3
      - name: Sign both images
        run: |
          cosign sign --yes "${REGISTRY}/${NAMESPACE}/content@${{ steps.content.outputs.digest }}"
          cosign sign --yes "${REGISTRY}/${NAMESPACE}/audio@${{ steps.audio.outputs.digest }}"

      - name: Record the released IDs
        # From here on, these IDs are a public contract: a later release that drops one
        # without a transition fails CI.
        run: |
          python tools/check.py --update-snapshot
          echo "Commit the updated released-ids.json — it is the ID stability baseline."
          cat released-ids.json
